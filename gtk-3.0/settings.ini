[Settings]

# --- Tema visual ---
gtk-theme-name=Colloid-Catppuccin-Mocha-Pink
gtk-icon-theme-name=Papirus-Dark
gtk-application-prefer-dark-theme=1

# --- Fuente ---
# Nota: JetBrains Mono es monoespaciada; si más adelante sientes que las
# etiquetas de menús/botones se ven raras, prueba una fuente sans como
# "Cantarell 10" o "Inter 10" solo para la UI (deja JetBrains Mono en tu
# terminal/editor, donde sí tiene sentido).
gtk-font-name=JetBrains Mono 10

# --- Cursor ---
# Debe coincidir con XCURSOR_THEME/XCURSOR_SIZE en ~/.config/labwc/environment
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=24
gtk-cursor-blink=true
gtk-cursor-blink-time=1000

# --- Barra de herramientas y botones ---
gtk-toolbar-style=3
gtk-toolbar-icon-size=GTK_ICON_SIZE_LARGE_TOOLBAR
gtk-button-images=0
gtk-menu-images=0

# --- Sonidos ---
gtk-enable-event-sounds=1
gtk-enable-input-feedback-sounds=0
gtk-sound-theme-name=ocean

# --- Renderizado de fuentes (antialiasing/hinting) ---
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb

# --- Decoración y comportamiento de ventanas GTK (CSD) ---
gtk-decoration-layout=icon:minimize,maximize,close
gtk-enable-animations=true
gtk-primary-button-warps-slider=true
